name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request_target:
    types: [opened, reopened, synchronize, closed, edited]
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       (startsWith(github.event.pull_request.head.ref, 'community-maps/issue-') ||
        startsWith(github.event.pull_request.head.ref, 'community-changes/issue-')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate community submission automation
        run: |
          python3 -m py_compile scripts/process_submission.py scripts/process_change_request.py
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from process_submission import updated_catalog, parse_proposal
          original = Path("custommap_cate.json").read_text(encoding="utf-8")
          categories = json.loads(original)
          new_id = "999888777666"
          for index in (0, len(categories) // 2, len(categories) - 1):
              updated = json.loads(updated_catalog(original, categories[index]["button"], new_id))
              assert updated[index]["ugc"] == categories[index]["ugc"] + [new_id]
              assert all(updated[i] == categories[i] for i in range(len(categories)) if i != index)
          proposal = {"title": "[Map Submission] 1234567890",
                      "body": "<!-- aae-map-submission:v1 -->\nWorkshop ID: 1234567890\nCategory: AAEP_ZC2_MAP\nNotes:\nNone"}
          assert parse_proposal(proposal)[0] == "1234567890"
          lite_proposal = {"title": "[Map Submission] 1234567890",
                           "body": "<!-- aae-map-submission:v1 -->\nWorkshop ID: 1234567890\n"
                                   "Category: AAEP_ZC2_MAP\nLite Only: true\nNotes:\nNone"}
          assert parse_proposal(lite_proposal)[3] is True
          lite_added = json.loads(updated_catalog(
              original, categories[0]["button"], new_id, True))
          assert lite_added[0]["ugc"][-1] == {"id": new_id, "lite_only": True}
          print("Submission workflow validation passed.")
          PY
      - name: Validate pending PR feed parser
        run: |
          python3 -m py_compile scripts/fetch_pending_prs.py scripts/fetch_steam.py
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from fetch_pending_prs import catalog_info, parse_pending
          categories, existing = catalog_info()
          category = sorted(categories)[0]
          pr = {
              "state": "open", "draft": False, "number": 17,
              "created_at": "2026-10-08T07:20:05Z",
              "head": {"repo": {"full_name": "k7Ysh5A41/AAE-Custom-Map-Category"},
                       "ref": "community-maps/issue-16"},
              "base": {"ref": "main"},
              "html_url": "https://github.com/k7Ysh5A41/AAE-Custom-Map-Category/pull/17",
              "body": "<!-- aae-map-pr:v1 -->\nWorkshop ID: 999888777666\n"
                      f"Category: {category}\n",
          }
          assert parse_pending(pr, categories, existing)["id"] == "999888777666"
          pr["body"] += "Lite Only: true\n"
          assert parse_pending(pr, categories, existing)["lite_only"] is True
          assert parse_pending({**pr, "state": "closed"}, categories, existing) is None
          assert parse_pending(pr, categories, existing | {"999888777666"}) is None
          assert parse_pending({**pr, "head": {"repo": {"full_name": "other/repo"},
              "ref": "community-maps/issue-16"}}, categories, existing) is None
          print("Pending PR feed validation passed.")
          PY
      - name: Validate map change and removal PR generation
        run: |
          python3 -m py_compile scripts/process_change_request.py
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from process_change_request import parse_change, updated_change_catalog
          from fetch_pending_prs import parse_pending_change
          source = Path("custommap_cate.json").read_text(encoding="utf-8")
          categories = json.loads(source)
          first, second = categories[0], categories[1]
          item = first["ugc"][0]
          workshop_id = str(item["id"] if isinstance(item, dict) else item)
          before = sum(len(c["ugc"]) for c in categories)
          issue = {
              "title": "[Map Change] " + workshop_id,
              "body": "<!-- aae-map-change:v1 -->\n"
                      "Workshop ID: " + workshop_id + "\nAction: move\n"
                      "Original Category: " + first["button"] + "\n"
                      "Target Category: " + second["button"] + "\n"
                      "Reason:\nIncorrect map category"
          }
          assert parse_change(issue)[:4] == (
              workshop_id, "move", first["button"], second["button"])
          moved = json.loads(updated_change_catalog(source, workshop_id,
              "move", first["button"], second["button"]))
          assert sum(len(c["ugc"]) for c in moved) == before
          assert item not in moved[0]["ugc"]
          assert moved[1]["ugc"][-1] == item
          current_lite = isinstance(item, dict) and item.get("lite_only") is True
          status_update = json.loads(updated_change_catalog(
              source, workshop_id, "update", first["button"], first["button"],
              current_lite, not current_lite))
          status_item = status_update[0]["ugc"][0]
          assert (isinstance(status_item, dict) and
                  status_item.get("lite_only") is True) is (not current_lite)
          assert all(status_update[i] == categories[i]
                     for i in range(1, len(categories)))
          lite_move = json.loads(updated_change_catalog(
              source, workshop_id, "move", first["button"], second["button"],
              current_lite, not current_lite))
          lite_moved = lite_move[1]["ugc"][-1]
          assert (isinstance(lite_moved, dict) and
                  lite_moved.get("lite_only") is True) is (not current_lite)
          flagged_issue = dict(issue, body=issue["body"].replace(
              "Reason:", f"Current Lite Only: {str(current_lite).lower()}\n"
                         f"Lite Only: {str(not current_lite).lower()}\nReason:"))
          assert parse_change(flagged_issue)[5:] == (current_lite, not current_lite)
          deleted = json.loads(updated_change_catalog(source, workshop_id,
              "delete", first["button"], "none"))
          assert sum(len(c["ugc"]) for c in deleted) == before - 1
          assert item not in deleted[0]["ugc"]
          for action, changed in (("move", moved), ("delete", deleted)):
              assert all(changed[i] == categories[i] for i in range(2,len(categories)))
          try:
              updated_change_catalog(source, workshop_id,
                                     "move", first["button"], first["button"])
              raise AssertionError("Same-category move should fail")
          except ValueError:
              pass
          pr = {
              "state":"open","draft":False,"number":13,
              "created_at":"2026-10-08T10:00:00Z",
              "head":{"repo":{"full_name":"k7Ysh5A41/AAE-Custom-Map-Category"},
                      "ref":"community-changes/issue-12"},
              "base":{"ref":"main"},
              "html_url":"https://github.com/k7Ysh5A41/AAE-Custom-Map-Category/pull/13",
              "body":"<!-- aae-map-change-pr:v1 -->\n"
                  "Workshop ID: " + workshop_id + "\nAction: move\n"
                  "From Category: " + first["button"] + "\n"
                  "Target Category: " + second["button"] + "\n"
          }
          keys = {c["button"] for c in categories}
          assert parse_pending_change(pr,keys,categories)["id"] == workshop_id
          update_pr = dict(pr, body=pr["body"].replace(
              "Action: move", "Action: update").replace(
              "Target Category: " + second["button"],
              "Target Category: " + first["button"] +
              f"\nCurrent Lite Only: {str(current_lite).lower()}" +
              f"\nLite Only: {str(not current_lite).lower()}"))
          assert parse_pending_change(update_pr,keys,categories)["lite_only"] is (not current_lite)
          assert parse_pending_change(dict(pr,state="closed"),keys,categories) is None
          assert parse_pending_change(dict(pr,body=pr["body"].replace(
              "Action: move", "Action: invalid")),keys,categories) is None
          print("Move/delete PR validation passed.")
          PY
      - name: Fetch AAE category localizations
        shell: bash
        run: |
          set -euo pipefail
          for language in english french german italian japanese polish portuguese russian spanish; do
            mkdir -p "localization/$language"
            if ! curl --fail --location --retry 3 --silent --show-error \
              "https://raw.githubusercontent.com/k7Ysh5A41/AAE-localizedstrings/main/$language/localizedstrings/AAEP.str" \
              --output "localization/$language/AAEP.str"; then
              if [ "$language" = "english" ]; then
                echo "::error::English localization is required for fallback."
                exit 1
              fi
              rm -f "localization/$language/AAEP.str"
              echo "::warning::Missing $language localization; browsers can fall back to English."
            fi
          done
      - name: Fetch pending community pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m py_compile scripts/fetch_pending_prs.py
          python3 scripts/fetch_pending_prs.py
      - name: Build recently merged map feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m py_compile scripts/fetch_recent_maps.py
          python3 - <<'PY'
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import json
          sys.path.insert(0, "scripts")
          from fetch_recent_maps import parse_recent
          catalog = json.loads(Path("custommap_cate.json").read_text(encoding="utf-8"))
          category = next(c for c in catalog if c["ugc"])
          entry = category["ugc"][0]
          workshop_id = str(entry["id"] if isinstance(entry, dict) else entry)
          now = datetime.now(timezone.utc)
          pr = {
            "number": 42,
            "merged_at": now.isoformat(),
            "html_url": "https://github.com/k7Ysh5A41/AAE-Custom-Map-Category/pull/42",
            "user": {"login": "github-actions[bot]"},
            "head": {"repo": {"full_name": "k7Ysh5A41/AAE-Custom-Map-Category"},
                     "ref": "community-maps/issue-41"},
            "base": {"ref": "main"},
            "body": "<!-- aae-map-pr:v1 -->\nWorkshop ID: " + workshop_id +
                    "\nCategory: " + category["button"] + "\n",
          }
          assert parse_recent(pr, {workshop_id: category["button"]}, now)["id"] == workshop_id
          assert parse_recent(dict(pr, merged_at=(now - timedelta(days=8)).isoformat()),
                              {workshop_id: category["button"]}, now) is None
          assert parse_recent(pr, {workshop_id: "AAEP_INVALID_MAP"}, now) is None
          assert parse_recent(dict(pr, merged_at=None),
                              {workshop_id: category["button"]}, now) is None
          print("Recent approved PR feed validation passed.")
          PY
          python3 scripts/fetch_recent_maps.py
      - name: Fetch Steam Workshop metadata
        run: python3 scripts/fetch_steam.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_final.outputs.page_url || steps.deploy_retry.outputs.page_url || steps.deploy_first.outputs.page_url }}
    steps:
      # A failed-job rerun now retries only deployment; the successful build
      # retains the one "github-pages" artifact from its original job.
      - name: Publish to Pages (first attempt)
        id: deploy_first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Back off before the second attempt
        if: steps.deploy_first.outcome == 'failure'
        run: sleep 15
      - name: Publish to Pages (second attempt)
        id: deploy_retry
        if: steps.deploy_first.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Back off before the final attempt
        if: steps.deploy_first.outcome == 'failure' && steps.deploy_retry.outcome == 'failure'
        run: sleep 30
      - name: Publish to Pages (final attempt)
        id: deploy_final
        if: steps.deploy_first.outcome == 'failure' && steps.deploy_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
