name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request_target:
    types: [opened, reopened, synchronize, closed, edited]
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'community-maps/issue-'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate community submission automation
        run: |
          python3 -m py_compile scripts/process_submission.py
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from process_submission import updated_catalog, parse_proposal
          original = Path("custommap_cate.json").read_text(encoding="utf-8")
          categories = json.loads(original)
          new_id = "999888777666"
          for index in (0, len(categories) // 2, len(categories) - 1):
              updated = json.loads(updated_catalog(original, categories[index]["button"], new_id))
              assert updated[index]["ugc"] == categories[index]["ugc"] + [new_id]
              assert all(updated[i] == categories[i] for i in range(len(categories)) if i != index)
          proposal = {"title": "[Map Submission] 1234567890",
                      "body": "<!-- aae-map-submission:v1 -->\nWorkshop ID: 1234567890\nCategory: AAEP_ZC2_MAP\nNotes:\nNone"}
          assert parse_proposal(proposal)[0] == "1234567890"
          print("Submission workflow validation passed.")
          PY
      - name: Validate pending PR feed parser
        run: |
          python3 -m py_compile scripts/fetch_pending_prs.py scripts/fetch_steam.py
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from fetch_pending_prs import catalog_info, parse_pending
          categories, existing = catalog_info()
          category = sorted(categories)[0]
          pr = {
              "state": "open", "draft": False, "number": 17,
              "created_at": "2026-10-08T07:20:05Z",
              "head": {"repo": {"full_name": "k7Ysh5A41/AAE-Custom-Map-Category"},
                       "ref": "community-maps/issue-16"},
              "base": {"ref": "main"},
              "html_url": "https://github.com/k7Ysh5A41/AAE-Custom-Map-Category/pull/17",
              "body": "<!-- aae-map-pr:v1 -->\nWorkshop ID: 999888777666\n"
                      f"Category: {category}\n",
          }
          assert parse_pending(pr, categories, existing)["id"] == "999888777666"
          assert parse_pending({**pr, "state": "closed"}, categories, existing) is None
          assert parse_pending(pr, categories, existing | {"999888777666"}) is None
          assert parse_pending({**pr, "head": {"repo": {"full_name": "other/repo"},
              "ref": "community-maps/issue-16"}}, categories, existing) is None
          print("Pending PR feed validation passed.")
          PY
      - name: Fetch AAE category localizations
        shell: bash
        run: |
          set -euo pipefail
          for language in english french german italian japanese polish portuguese russian spanish; do
            mkdir -p "localization/$language"
            if ! curl --fail --location --retry 3 --silent --show-error \
              "https://raw.githubusercontent.com/k7Ysh5A41/AAE-localizedstrings/main/$language/localizedstrings/AAEP.str" \
              --output "localization/$language/AAEP.str"; then
              if [ "$language" = "english" ]; then
                echo "::error::English localization is required for fallback."
                exit 1
              fi
              rm -f "localization/$language/AAEP.str"
              echo "::warning::Missing $language localization; browsers can fall back to English."
            fi
          done
      - name: Fetch pending community pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m py_compile scripts/fetch_pending_prs.py
          python3 scripts/fetch_pending_prs.py
      - name: Fetch Steam Workshop metadata
        run: python3 scripts/fetch_steam.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
